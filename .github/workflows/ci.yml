name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (declaration emit)
        run: pnpm run build

      - name: Assert declarations were emitted
        run: test -f dist/index.d.ts && test -f dist/index.js

      - name: Unit tests and packed-surface test
        run: pnpm run test

      - name: API contract drift check
        run: pnpm run check:drift

      - name: Consumer compatibility (ESM + TypeScript)
        run: pnpm run test:consumers

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: License gate
        run: pnpm run check:licenses
