name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (declaration emit)
        run: pnpm run build

      - name: Assert declarations were emitted
        run: test -f dist/index.d.ts && test -f dist/index.js

      - name: Unit tests and packed-surface test
        run: pnpm run test

      - name: API contract drift check
        run: pnpm run check:drift

      - name: Consumer compatibility (ESM + TypeScript)
        run: pnpm run test:consumers

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: License gate
        run: pnpm run check:licenses
