name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (declaration emit)
        run: pnpm run build

      - name: Assert declarations were emitted
        run: test -f dist/index.d.ts && test -f dist/index.js

      - name: Unit tests and packed-surface test
        run: pnpm run test

      - name: API contract drift check
        run: pnpm run check:drift

      - name: Consumer compatibility (ESM + TypeScript)
        run: pnpm run test:consumers

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: License gate
        run: pnpm run check:licenses
